<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Orto admin</title>
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
:root{
  color-scheme:light dark;
  --bg:#f8f9fb;--fg:#1a1d23;--mut:#535863;--line:#e6e8ec;--card:#ffffff;--input:#f5f6f9;--acc:#c4532f;--acc-hover:#a8431f;--bad:#b3261e;
  accent-color:var(--acc);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#16181e;--fg:#f2f4f7;--mut:#9da3af;--line:#2c303a;--card:#1e2128;--input:#171920;--acc:#e0714b;--acc-hover:#eb8764;--bad:#f2766e}
}
@supports(color:light-dark(white,black)){
  :root{
    --bg:light-dark(#f8f9fb,#16181e);
    --fg:light-dark(#1a1d23,#f2f4f7);
    --mut:light-dark(#535863,#9da3af);
    --line:light-dark(#e6e8ec,#2c303a);
    --card:light-dark(#ffffff,#1e2128);
    --input:light-dark(#f5f6f9,#171920);
    --acc:light-dark(#c4532f,#e0714b);
    --acc-hover:light-dark(#a8431f,#eb8764);
    --bad:light-dark(#b3261e,#f2766e);
  }
}
*{box-sizing:border-box}
body{margin:0 auto;max-width:860px;padding:32px 20px 64px;background:var(--bg);color:var(--fg);font:15px/1.55 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-family:'Outfit','Inter',system-ui,sans-serif;font-size:24px;letter-spacing:-0.02em;margin:0 0 20px}
h2{font-size:12px;margin:28px 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
label{display:block;margin:12px 0 5px;color:var(--mut);font-size:13px;font-weight:500}
input,select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--fg);transition:border-color .15s,background-color .15s}
input:focus,select:focus{outline:none;border-color:var(--acc)}
button{cursor:pointer;background:var(--card);font-weight:500}
button:hover{border-color:var(--mut)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.p:hover{background:var(--acc-hover);border-color:var(--acc-hover)}
button.d{color:var(--bad)}
button.d:hover{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}.mut{color:var(--mut);font-size:13px;margin-top:10px}#msg{min-height:1.4em;margin-top:14px;font-weight:500}.err{color:var(--bad)}
</style>
</head>
<body>
<h1>Orto admin</h1>
<form id="login" class="card" hidden>
  <label for="pass">Admin password (ORTO_ADMIN_PASS)</label>
  <div class="row"><input id="pass" type="password" autocomplete="current-password" required><button class="p">Sign in</button></div>
</form>
<main id="app" hidden>
  <h2>Settings</h2>
  <div class="card">
    <label for="registration">Registration</label>
    <select id="registration"><option value="open">open</option><option value="closed">closed</option></select>
    <label for="maxUpload">Max upload size (MB)</label><input id="maxUpload" type="number" min="1" step="any">
    <label for="quota">Quota per user (MB)</label><input id="quota" type="number" min="1" step="any">
    <p class="mut" id="info"></p>
    <div class="row"><button class="p" id="save">Save</button><button id="reset">Back to env defaults</button></div>
  </div>
  <h2>Users</h2>
  <div class="card wrap"><table><thead><tr><th>Name</th><th>Created</th><th>Records</th><th>Files</th><th>Used</th><th>Sessions</th><th></th></tr></thead><tbody id="users"></tbody></table>
    <p class="mut">Data is end-to-end encrypted, so passwords cannot be reset: removing a user deletes all of their data.</p></div>
  <h2>Backup</h2>
  <div class="card row"><button id="backup">Back up now</button><span class="mut">Database + uploads, written on the server under the data folder.</span></div>
  <p><button id="out">Sign out</button></p>
</main>
<div id="msg" role="status"></div>
<script>
const $ = (id) => document.getElementById(id), MB = 1048576;
let token = ''; try { token = sessionStorage.getItem('orto-admin') || ''; } catch (_) {}
const say = (t, bad) => { $('msg').textContent = t || ''; $('msg').className = bad ? 'err' : ''; };
async function call(method, path, body) {
  const r = await fetch('/api/admin/' + path, { method, headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { out(); }
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const fmt = (n) => n >= MB * 1024 ? (n / MB / 1024).toFixed(1) + ' GB' : n >= MB ? (n / MB).toFixed(1) + ' MB' : (n / 1024).toFixed(0) + ' KB';
function out() { token = ''; try { sessionStorage.removeItem('orto-admin'); } catch (_) {} $('app').hidden = true; $('login').hidden = false; }
async function load() {
  try {
    const [s, users] = await Promise.all([call('GET', 'settings'), call('GET', 'users')]);
    $('registration').value = s.settings.registration;
    $('maxUpload').value = +(s.settings.maxUpload / MB).toFixed(2);
    $('quota').value = +(s.settings.quota / MB).toFixed(2);
    $('info').textContent = `Env defaults: registration ${s.defaults.registration}, upload ${s.defaults.maxUpload / MB} MB, quota ${s.defaults.quota / MB} MB. Demo account: ${s.demo ? 'on (set via ORTO_DEMO)' : 'off'}. Data folder: ${s.dataDir}`;
    const body = $('users'); body.textContent = '';
    for (const u of users) {
      const tr = body.insertRow();
      for (const v of [u.name, new Date(u.createdAt).toISOString().slice(0, 10), u.records, u.files, fmt(u.bytes), u.sessions]) tr.insertCell().textContent = v;
      const cell = tr.insertCell(); cell.className = 'row';
      const eu = encodeURIComponent(u.name);
      const lo = Object.assign(document.createElement('button'), { textContent: 'Sign out' });
      lo.onclick = () => act(() => call('POST', `users/${eu}/logout`), `${u.name} signed out everywhere`);
      const del = Object.assign(document.createElement('button'), { textContent: 'Delete', className: 'd' });
      del.onclick = () => { if (prompt(`Delete "${u.name}" and ALL their data? Type the name to confirm.`) === u.name) act(() => call('DELETE', `users/${eu}`), `${u.name} deleted`); };
      cell.append(lo, del);
    }
    $('login').hidden = true; $('app').hidden = false;
  } catch (e) { say(e.message, true); }
}
async function act(fn, ok) { try { const r = await fn(); say(typeof ok === 'function' ? ok(r) : ok); await load(); } catch (e) { say(e.message, true); } }
$('login').onsubmit = async (e) => {
  e.preventDefault();
  try { token = (await call('POST', 'login', { pass: $('pass').value })).token; try { sessionStorage.setItem('orto-admin', token); } catch (_) {} $('pass').value = ''; say(''); await load(); }
  catch (e) { say(e.message, true); }
};
$('save').onclick = () => {
  const maxUpload = Math.round(Number($('maxUpload').value) * MB), quota = Math.round(Number($('quota').value) * MB);
  if (!(maxUpload >= 1) || !(quota >= 1)) return say('Upload limit and quota must be positive numbers.', true);
  act(() => call('PUT', 'settings', { registration: $('registration').value, maxUpload, quota }), 'Saved');
};
$('reset').onclick = () => act(() => call('PUT', 'settings', { registration: null, maxUpload: null, quota: null }), 'Back to env defaults');
$('backup').onclick = () => act(() => call('POST', 'backup'), (r) => 'Backup written to ' + r.path);
$('out').onclick = out;
token ? load() : out();
</script>
</body>
</html>
