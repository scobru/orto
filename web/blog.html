<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Blog</title>
<link id="feed" rel="alternate" type="application/rss+xml">
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfc;
    --fg: #1a1d23;
    --mut: #535863;
    --line: #e6e8ec;
    --card: #ffffff;
    --acc: #c4532f;
    --code-bg: #f3f4f7;
    accent-color: var(--acc);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d23;
      --fg: #f2f4f7;
      --mut: #a2a8b4;
      --line: #2c303a;
      --card: #22252e;
      --acc: #e0714b;
      --code-bg: #17191f;
    }
  }
  @supports (color: light-dark(white, black)) {
    :root {
      --bg: light-dark(#fbfbfc, #1b1d23);
      --fg: light-dark(#1a1d23, #f2f4f7);
      --mut: light-dark(#535863, #a2a8b4);
      --line: light-dark(#e6e8ec, #2c303a);
      --card: light-dark(#ffffff, #22252e);
      --acc: light-dark(#c4532f, #e0714b);
      --code-bg: light-dark(#f3f4f7, #17191f);
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.7 'Inter', system-ui, sans-serif;
    max-width: 44rem;
    margin: 0 auto;
    padding: 32px 20px 72px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--acc); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  article { margin: 0 0 3rem; }
  h1 { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-size: 1.55rem; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
  h2 { font-family: 'Outfit', 'Inter', system-ui, sans-serif; letter-spacing: -0.015em; margin-bottom: .3rem; }
  small { color: var(--mut); }
  img { max-width: 100%; height: auto; border-radius: 12px; }
  pre, code { font-family: 'IBM Plex Mono', ui-monospace, monospace; background: var(--code-bg); border-radius: 6px; }
  pre { padding: 14px 16px; overflow-x: auto; border: 1px solid var(--line); }
  code { padding: 2px 6px; font-size: 0.9em; }
  pre code { background: transparent; padding: 0; }
  #index { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  #index li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; transition: border-color .16s ease, transform .16s ease; }
  #index li:hover { border-color: var(--acc); transform: translateY(-1px); }
  #index a { font-size: 1.15rem; font-weight: 600; text-decoration: none; }
  #index a:hover { text-decoration: underline; }
  #index p { margin: .45rem 0 0; color: var(--mut); font-size: 0.95rem; }
  nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<h1><a id="who"></a></h1>
<p><small><a id="rss">RSS</a></small></p>
<main id="posts">Loading…</main>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
  function decodeB64u(str) {
    const pad = str.length % 4 === 0 ? '' : '='.repeat(4 - (str.length % 4));
    const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/') + pad);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function renderMarkdown(el, md) {
    if (!window.marked) { el.textContent = md || ''; return; }
    const html = marked.parse(md || '');
    if ('setHTML' in Element.prototype) {
      el.setHTML(html);
    } else if (window.DOMPurify) {
      el.replaceChildren(DOMPurify.sanitize(html, { RETURN_DOM_FRAGMENT: true }));
    } else {
      el.textContent = md || '';
    }
  }

  // Support #fblog=<payload> hash for serverless Freenet view
  if (/^#fblog=/.test(location.hash)) {
    try {
      const raw = location.hash.slice(7);
      const p = JSON.parse(decodeB64u(raw));
      const author = p.authorAlias || p.author || 'Author';
      document.getElementById('who').textContent = author + "'s Blog";
      document.title = (p.title || 'Untitled') + ' · ' + author;
      document.getElementById('rss').parentElement.style.display = 'none';
      const root = document.getElementById('posts');
      root.textContent = '';
      const el = document.createElement('article');
      const h = document.createElement('h1'); h.textContent = p.title || 'Untitled';
      const d = document.createElement('small'); d.textContent = p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '';
      const body = document.createElement('div');
      body.style.marginTop = '1rem';
      renderMarkdown(body, p.content || '');
      el.append(h, d, body);
      root.append(el);
    } catch (e) {
      document.getElementById('posts').textContent = 'Cannot open this post.';
    }
  } else {
    // /blog/<username> or ?user=<name>: index of public posts; ?post=<id>: one post
    const params = new URLSearchParams(location.search);
    let name = '';
    try { name = decodeURIComponent(params.get('user') || location.pathname.split('/')[2] || ''); } catch (_) {}
    const only = params.get('post');
    if (name) {
      document.getElementById('who').textContent = name;
      document.title = name + ' · Blog';
      document.getElementById('rss').href = '/blog/' + encodeURIComponent(name) + '/feed.xml';
      document.getElementById('feed').href = '/blog/' + encodeURIComponent(name) + '/feed.xml';
      document.getElementById('feed').title = name;
      document.getElementById('who').href = '/blog/' + encodeURIComponent(name);
    }
    const userQ = params.get('user') ? 'user=' + encodeURIComponent(params.get('user')) + '&' : '';
    const link = (p) => '?' + userQ + 'post=' + encodeURIComponent(p.id || p.soul);
    const a = (href, text) => { const el = document.createElement('a'); el.href = href; el.textContent = text; return el; };
    const date = (p) => { const d = document.createElement('small'); d.textContent = new Date(p.createdAt).toLocaleDateString(); return d; };
    fetch('/api/u/' + encodeURIComponent(name) + '/posts').then(r => r.ok ? r.json() : Promise.reject()).then(list => {
      const posts = list.filter(p => !p.deleted).sort((a, b) => b.createdAt - a.createdAt);
      const root = document.getElementById('posts');
      root.textContent = posts.length ? '' : 'No posts.';
      if (!only) {
        const ul = document.createElement('ul'); ul.id = 'index';
        for (const p of posts) {
          const li = document.createElement('li');
          const ex = document.createElement('p'); ex.textContent = (p.content || '').replace(/[#*_>`\[\]()!-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 160);
          li.append(a(link(p), p.title || 'Untitled'), document.createElement('br'), date(p), ex); ul.append(li);
        }
        if (posts.length) root.append(ul);
        return;
      }
      const i = posts.findIndex(p => (p.id || p.soul) === only);
      if (i < 0) { root.textContent = 'Not found.'; return; }
      const p = posts[i];
      document.title = (p.title || 'Untitled') + ' · ' + name;
      const el = document.createElement('article');
      const h = document.createElement('h2'); h.textContent = p.title || 'Untitled';
      const body = document.createElement('div');
      renderMarkdown(body, p.content || '');
      el.append(h, date(p), body);
      const nav = document.createElement('nav');
      nav.append(posts[i - 1] ? a(link(posts[i - 1]), '← ' + (posts[i - 1].title || 'Newer')) : document.createElement('span'),
        a('/blog/' + encodeURIComponent(name), 'All posts'),
        posts[i + 1] ? a(link(posts[i + 1]), (posts[i + 1].title || 'Older') + ' →') : document.createElement('span'));
      root.append(el, nav);
    }).catch(() => { document.getElementById('posts').textContent = 'Not found.'; });
  }
</script>
</body>
</html>
