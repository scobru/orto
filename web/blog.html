<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog</title>
<link id="feed" rel="alternate" type="application/rss+xml">
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.6 system-ui, sans-serif; max-width: 42rem; margin: 0 auto; padding: 24px 16px 64px; }
  article { margin: 0 0 3rem; }
  h1 { font-size: 1.4rem; margin-bottom: 2rem; }
  h2 { margin-bottom: .2rem; }
  small { opacity: .6; }
  img { max-width: 100%; }
</style>
</head>
<body>
<h1 id="who"></h1>
<p><small><a id="rss">RSS</a></small></p>
<main id="posts">Loading…</main>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
  // /blog/<username>[?post=<id>]: public posts of one user, markdown rendered and sanitized
  const name = decodeURIComponent(location.pathname.split('/')[2] || '');
  const only = new URLSearchParams(location.search).get('post');
  document.getElementById('who').textContent = name;
  document.title = name + ' · Blog';
  document.getElementById('rss').href = '/blog/' + encodeURIComponent(name) + '/feed.xml';
  document.getElementById('feed').href = '/blog/' + encodeURIComponent(name) + '/feed.xml';
  document.getElementById('feed').title = name;
  fetch('/api/u/' + encodeURIComponent(name) + '/posts').then(r => r.ok ? r.json() : Promise.reject()).then(list => {
    const posts = list.filter(p => !p.deleted && (!only || (p.id || p.soul) === only)).sort((a, b) => b.createdAt - a.createdAt);
    const root = document.getElementById('posts');
    root.textContent = posts.length ? '' : 'No posts.';
    for (const p of posts) {
      const el = document.createElement('article');
      const h = document.createElement('h2'); h.textContent = p.title;
      const d = document.createElement('small'); d.textContent = new Date(p.createdAt).toLocaleDateString();
      const body = document.createElement('div'); body.innerHTML = DOMPurify.sanitize(marked.parse(p.content || ''));
      el.append(h, d, body); root.append(el);
    }
  }).catch(() => { document.getElementById('posts').textContent = 'Not found.'; });
</script>
</body>
</html>
